name: Backend checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pixel_test
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: pixel_ci
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U pixel_test" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: unused-ci-only-secret-for-testing-with-no-production-access
      DATABASE_URL: postgresql://pixel_test:disposable-ci-password@127.0.0.1:5432/pixel_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository history for secrets
        working-directory: .
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts=--all .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.23 pip-audit==2.10.1
      - run: uv sync --locked --python 3.12
      - name: Audit installed backend dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/pixel-requirements.txt" > /dev/null
          pip-audit --require-hashes --disable-pip -r "$RUNNER_TEMP/pixel-requirements.txt"
      - run: uv run --locked ruff check .
      - run: uv run --locked python ../face_recognition/download_models.py
      - run: uv run --locked python manage.py makemigrations --check --dry-run
      - run: |
          mkdir -p .local
          uv run --locked python manage.py test tests --noinput
      - name: Check production settings and collect admin static files
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_ALLOWED_HOSTS: api.example.test
          FRONTEND_URL: https://app.example.test
          BACKEND_URL: https://api.example.test
          PIXEL_CACHE_URL: redis://127.0.0.1:6379/0
          EMAIL_HOST: smtp.example.test
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: 'true'
          DJANGO_HSTS_PRELOAD: 'true'
        run: |
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
          uv run --locked python manage.py check --deploy --fail-level WARNING
          uv run --locked python manage.py collectstatic --noinput
