[project]
name = "pixel-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<4",
  "djangorestframework-simplejwt>=5.5,<6",
  "django-cors-headers>=4.7,<5",
  "dj-database-url>=3,<4",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "google-auth>=2.40,<3",
  "requests>=2.32,<3",
  "httpx>=0.28,<1",
  "opencv-python-headless>=4.12,<5",
  "numpy>=2,<3",
  "pillow>=13,<14",
  "pgvector>=0.4,<0.5",
  "redis>=6,<8",
  "gunicorn>=23,<27",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[tool.ruff]
line-length = 100
exclude = ["apps/accounts/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
